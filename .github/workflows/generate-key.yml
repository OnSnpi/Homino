name: Generate Keystore Base64

on:
  workflow_dispatch:

jobs:
  generate-key:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate 100-year keystore and encode to Base64
        run: |
          keytool -genkey -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 36500 \
            -dname "CN=Homino,O=Homino,C=CZ"
          base64 -w 0 debug.keystore > key-base64.txt

      - name: Upload key-base64.txt artifact
        uses: actions/upload-artifact@v5
        with:
          name: Homino-Keystore-Base64
          path: key-base64.txt
